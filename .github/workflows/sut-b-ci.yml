name: SUT-B CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build / syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build stage (syntax validation)
        run: |
          mkdir -p reports
          for file in src/*.js; do
            node --check "$file"
          done | tee reports/build-report.txt

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: reports/build-report.txt
          if-no-files-found: warn

  unit-tests:
    name: Unit tests / DB smoke
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: delivery_student
          POSTGRES_PASSWORD: delivery_password
          POSTGRES_DB: delivery_variant18_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delivery_student -d delivery_variant18_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: delivery_variant18_test
      DB_USER: delivery_student
      DB_PASSWORD: delivery_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database schema
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f migrations/V1__create_tables.sql

      - name: Run automated tests
        run: |
          mkdir -p reports
          set -o pipefail
          npm test -- --json --outputFile=reports/unit-results.json 2>&1 | tee reports/unit-tests.txt

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: reports/
          if-no-files-found: warn

  integration-tests:
    name: Integration / regression tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration regression suite (Testcontainers)
        run: |
          mkdir -p reports
          set -o pipefail
          npm run regression -- --json --outputFile=reports/integration-results.json 2>&1 | tee reports/integration-tests.txt

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: reports/
          if-no-files-found: warn
          